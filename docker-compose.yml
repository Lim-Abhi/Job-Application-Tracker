services:
  database:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jobapp123
      MYSQL_DATABASE: job_tracker
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - job-app-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - job-app-net

  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: jobapp
      DB_PASSWORD: jobapp123
      DB_NAME: job_tracker
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - job-app-net

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - job-app-net

networks:
  job-app-net:
    driver: bridge

volumes:
  job-app-db-data:

